<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Primary meta -->
    <title>FixFlow — App Store Screenshot Designer</title>
    <meta name="description" content="Design polished App Store screenshot layouts with FixFlow — a visual editor for iOS and Android screenshots." />
    <meta name="theme-color" content="#0f0f13" />

    <!--
      Paint the theme before the first frame.

      The app applies the theme itself once React is up, but that is one frame
      too late: a light phone would flash the dark surface first. Six lines of
      blocking script is the standard price for not flashing, and it degrades
      to the dark default if storage is unreadable.
    -->
    <script>
      (function () {
        try {
          // Still the old key: the app was renamed, the browsers people
          // already use it in were not. See src/store/idb-storage.ts.
          var saved = localStorage.getItem('pixeldeck.theme');
          var pref = saved === 'light' || saved === 'dark' ? saved : 'system';
          var resolved = pref === 'system'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : pref;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
        } catch (error) { /* Private window: the default stands. */ }
      })();
    </script>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FixFlow — App Store Screenshot Designer" />
    <meta property="og:description" content="Design polished App Store screenshot layouts with FixFlow — a visual editor for iOS and Android screenshots." />
    <meta property="og:image" content="/logo.svg" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FixFlow" />
    <meta name="twitter:description" content="Visual editor for App Store screenshot layouts." />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
